name: Pave
description: Pave is an AI-native compensation management platform that helps organizations
  make data-driven pay decisions. It combines real-time market benchmarking (compensation
  data sourced from 9,000+ companies), automated market pricing and salary-range building,
  merit-cycle and compensation-planning workflows, an employee-facing total rewards
  portal, and visual offer letters into one system. Pave connects to HRIS, ATS, equity-management,
  and performance-management systems to create a single source of truth for an organization's
  compensation ecosystem. Pave does not currently publish a public developer API or
  developer portal; its integration surface is inbound connectors to systems of record.
